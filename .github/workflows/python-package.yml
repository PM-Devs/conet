# This workflow installs CoNET, lints it with ruff, type-checks it with mypy,
# and runs the test suite (including the NATS-backed event-plane and
# acceptance tests) against every Python version the package supports.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]  # matches requires-python in pyproject.toml

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Start NATS (JetStream) for the event-plane and acceptance tests
      run: docker run -d --name nats -p 4222:4222 nats:latest -js
    - name: Install package with dev dependencies
      run: python -m pip install -e ".[dev]"
    - name: Lint with ruff
      run: ruff check src/ tests/
    - name: Type-check with mypy
      run: mypy src/conet
    - name: Test with pytest
      run: pytest
