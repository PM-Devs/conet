# Publishes CoNET to PyPI using Trusted Publishing (OpenID Connect) --
# no API token stored in this repo. Configure this workflow as a "pending
# publisher" at https://pypi.org/manage/account/publishing/ with:
#   Owner:            PM-Devs
#   Repository name:  conet
#   Workflow name:    publish.yml
#   Environment name: pypi
#
# Triggered by publishing a GitHub Release. Tag the release to match the
# version in pyproject.toml (e.g. tag "v0.1.0" for version = "0.1.0").

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # allows a manual re-run from the Actions tab if a release publish needs retrying

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/conet/
    permissions:
      id-token: write  # mandatory for Trusted Publishing -- do not remove
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
