<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}CoNET{% endblock %} — Operator Console</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; margin: 0; display: flex; min-height: 100vh; }
    nav { width: 190px; flex-shrink: 0; border-right: 1px solid #8884; padding: 1rem; }
    nav a { display: block; padding: .4rem 0; text-decoration: none; color: inherit; }
    nav a.active { font-weight: bold; text-decoration: underline; }
    main { flex: 1; padding: 1.25rem 1.5rem; max-width: 1100px; }
    table { border-collapse: collapse; width: 100%; margin: .75rem 0; }
    th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid #8883; font-size: .9rem; }
    .status-ok, .status-completed { color: #2a2; }
    .status-denied, .status-failed, .status-rejected, .status-timed_out { color: #c33; }
    .status-pending, .status-waiting_approval, .status-running, .status-routing, .status-authorizing { color: #c90; }
    .status-cancelled, .status-cancelling { color: #888; }
    form.inline { display: inline; }
    button { font-family: inherit; cursor: pointer; }
    .card { border: 1px solid #8884; border-radius: 6px; padding: .75rem 1rem; margin-bottom: 1rem; }
    .muted { opacity: .65; font-size: .85rem; }
    .stats-strip { display: flex; gap: 1.5rem; margin: .5rem 0 1rem; }
    .stat { border: 1px solid #8884; border-radius: 6px; padding: .5rem .9rem; }
    .stat .n { font-size: 1.3rem; font-weight: bold; display: block; }
    .stat .label { font-size: .75rem; opacity: .65; }
    .stat.warn .n { color: #c33; }
    #graph { width: 100%; height: 360px; border: 1px solid #8884; border-radius: 6px; }
    #graph text { font-size: 11px; font-family: inherit; }
    #graph .node circle { stroke-width: 1.5px; }
    #graph .edge { stroke: #8886; fill: none; }
    #graph .edge.warm { stroke: #f9a825; }
    #graph .edge.hot { stroke: #ea4335; }
  </style>
</head>
<body>
  <nav>
    <strong>CoNET</strong>
    <p class="muted">{{ current_user.email if current_user else "not signed in" }}</p>
    <a href="/dashboard/network" class="{{ 'active' if active == 'network' else '' }}">Network map</a>
    <a href="/dashboard/traffic" class="{{ 'active' if active == 'traffic' else '' }}">Live traffic</a>
    <a href="/dashboard/policy" class="{{ 'active' if active == 'policy' else '' }}">Policy editor</a>
    <a href="/dashboard/approvals" class="{{ 'active' if active == 'approvals' else '' }}">Approvals</a>
    <a href="/dashboard/audit" class="{{ 'active' if active == 'audit' else '' }}">Audit log</a>
    <a href="/dashboard/integrations" class="{{ 'active' if active == 'integrations' else '' }}">Integrations</a>
    <a href="/dashboard/team" class="{{ 'active' if active == 'team' else '' }}">Team &amp; accounts</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Shared by pages that want a live-updating view without a JS
    // framework: call once, it re-fetches JSON on an interval and hands
    // it to `onData`. A failed fetch (server restarting, network blip)
    // is logged and skipped rather than stopping the poll loop.
    function conetPoll(url, onData, intervalMs) {
      async function tick() {
        try {
          const res = await fetch(url, {headers: {'Accept': 'application/json'}});
          if (res.ok) onData(await res.json());
        } catch (err) {
          console.warn('conetPoll: fetch failed for', url, err);
        }
      }
      tick();
      return setInterval(tick, intervalMs || 4000);
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
